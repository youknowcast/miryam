[package]
name = "miryam"
version = "0.1.0"
edition = "2024"
# src/main.rs (マスコット本体) と src/bin/miryam-reader.rs の 2 バイナリ構成なので、
# README の `cargo run` (マスコット起動) が曖昧にならないよう既定を指定する
default-run = "miryam"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_6"] }
gtk4-layer-shell = "0.8"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
poppler-rs = "0.26.0"
cairo-rs = "0.22.0"

[dev-dependencies]
tempfile = "3.27.0"
